<script>
// Atalho curto para a bio do Instagram (movoapp.com.br/ios). Conta um clique anônimo (lp_event, sem cookie/ID) e leva para a App Store.
// Origem: ?ref= ou ?utm_source=; sem nada, conta como instagram (atalho criado para a bio em 20/11/2026).
(function(){
var URL="https://apps.apple.com/br/app/id6833195728";
var q=new URLSearchParams(location.search),src=(q.get('utm_source')||q.get('ref')||'instagram').toLowerCase().replace(/[^a-z]/g,'').slice(0,20);

function ir(){location.replace(URL)}
if(!ok)return ir();
try{fetch('https://wgdhjkebfvcmgokxscvb.supabase.co/rest/v1/rpc/lp_event',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:'sb_publishable_W0cKrWrtCwCp1XjNl1JFqQ_myok_WPk'},body:JSON.stringify({p_name:'cta_open_app',p_pos:'install',p_src:src})}).catch(function(){}).then(ir);setTimeout(ir,600)}catch(e){ir()}
})();
</script>
