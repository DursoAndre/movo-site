<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sair da lista de e-mails · Movo</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#14161A;--card:#1d2026;--line:#2e333c;--fg:#eef0f3;--mut:#9aa1ad;--ac:#bef230;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px}
main{max-width:420px;margin:0 auto;padding-top:18vh}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 8px}
p{color:var(--mut);margin:0 0 16px}
a{color:var(--ac)}
</style>
</head>
<body>
<main>
  <h1 id="t">Saindo da lista…</h1>
  <p id="m">Um instante.</p>
  <p><a href="https://app.movoapp.com.br">Abrir o Movo</a></p>
</main>
<script>
// Link dos recados por e-mail: movoapp.com.br/sair/?t=<token>. Chama a RPC pública email_sair (só funciona com o token certo).
(function () {
  var t = new URLSearchParams(location.search).get("t") || "";
  function fim(titulo, msg) { document.getElementById("t").textContent = titulo; document.getElementById("m").textContent = msg; }
  if (!/^[0-9a-f-]{36}$/i.test(t)) return fim("Link incompleto", "Abra o link direto do e-mail que você recebeu.");
  var KEY = "sb_publishable_W0cKrWrtCwCp1XjNl1JFqQ_myok_WPk";
  fetch("https://wgdhjkebfvcmgokxscvb.supabase.co/rest/v1/rpc/email_sair", {
    method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: t })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (ok) {
    if (ok) fim("Pronto, você saiu da lista", "Você não vai mais receber recados do Movo por e-mail. Avisos que aparecem dentro do app continuam.");
    else fim("Link não encontrado", "Esse link não é mais válido. Se continuar recebendo e-mails, responda um deles que a gente tira você da lista.");
  }).catch(function () { fim("Não deu certo agora", "Sem conexão. Tente abrir o link de novo daqui a pouco."); });
})();
</script>
</body>
</html>
