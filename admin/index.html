<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>Movo Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14161A;--card:#1d2026;--card2:#252931;--line:#2e333c;--fg:#eef0f3;--mut:#9aa1ad;--ac:#bef230;--ac-d:#14161A;--bad:#ff7a6b;--warn:#ffc857;--new:#5cc8ff;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));min-height:100vh;overscroll-behavior-y:contain}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;margin:0 -2px}
.bar{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo b{color:var(--ac)}
.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:44px;font-size:14px;color:var(--mut)}
.ib:active{background:var(--card2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;font-size:14px;color:var(--mut)}
.tab[aria-selected=true]{background:var(--ac);border-color:var(--ac);color:var(--ac-d);font-weight:700}
main{max-width:760px;margin:0 auto;padding-top:6px;transition:opacity .15s}
main.busy{opacity:.45;pointer-events:none}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px;font-weight:700}
.meta{color:var(--mut);font-size:12.5px;margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.g3 .stat{padding:10px 11px}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.g3 .stat .n{font-size:26px}
.stat .l{color:var(--mut);font-size:12.5px;margin-top:2px}
.stat .s{color:var(--mut);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.hi .n{color:var(--ac)}
.stat.warn .n{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-width:0}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
.note b{color:var(--fg)}
.chartbox{min-width:0}
.rd{font-size:12.5px;color:var(--mut);min-height:18px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.rd b{color:var(--fg)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;touch-action:pan-y}
.chart .c{flex:1;min-width:0;max-width:26px;height:100%;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.chart .c i{position:absolute;left:0;right:0;bottom:0;display:block;border-radius:3px 3px 0 0;background:var(--ac)}
.chart .c i.b{background:#5b6270}
.chart .c i.o{background:var(--new)}
.chart .c i.a{background:var(--warn)}
.chart.stack .c{display:flex;flex-direction:column;justify-content:flex-end}
.chart.stack .c i{position:static;border-radius:0}
.chart .c.sel{outline:2px solid var(--fg);outline-offset:1px;border-radius:3px}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:4px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--ac);margin-right:5px;vertical-align:-1px}
.legend .b::before{background:#5b6270}.legend .o::before{background:var(--new)}.legend .a::before{background:var(--warn)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.row .v small{color:var(--mut);font-weight:500;margin-left:5px}
.row .v.warn{color:var(--warn)}
.row .b{grid-column:1/-1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--ac);border-radius:3px}
.row .s{grid-column:1/-1;color:var(--mut);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:9px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12.5px;border-top:0}
td small,.mut{color:var(--mut)}
td.low{color:var(--mut)}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--card2);color:var(--mut);margin-left:6px;white-space:nowrap}
.pill.ok{background:rgba(190,242,48,.15);color:var(--ac)}
.pill.warn{background:rgba(255,200,87,.15);color:var(--warn)}
.cs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cs button{background:none;border:0;padding:0 14px;min-height:44px;font-size:14px;color:var(--mut)}
.cs button[aria-pressed=true]{background:var(--card2);color:var(--fg);font-weight:700}
.cq{width:100%;min-height:44px;margin:4px 0 8px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.cl{max-height:56vh;overflow-y:auto;padding:0 14px;overscroll-behavior:contain}
.ct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.ct:first-child{border-top:0}
.ct .t{min-width:0;overflow-wrap:anywhere}
.ct .s{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.ct .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ct .v small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:0 14px;min-height:44px;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--fg);font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.sk{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.err{background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.4);color:var(--bad);border-radius:12px;padding:12px 14px}
.verdict{font-size:18px;font-weight:800;margin-bottom:4px}
.verdict.ok{color:var(--ac)}.verdict.warn{color:var(--warn)}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
/* login */
.login{max-width:380px;margin:0 auto;padding-top:calc(14vh + env(safe-area-inset-top,0px))}
.login h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px}
.login p{color:var(--mut);margin:0 0 18px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;margin-bottom:10px;min-height:48px}
input:focus{outline:2px solid var(--ac);outline-offset:0}
.btn{width:100%;background:var(--ac);color:var(--ac-d);border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px;min-height:48px}
.btn:disabled{opacity:.6}
.lk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:0 4px;min-height:44px;font-size:14px}
.lk:disabled{opacity:.5;text-decoration:none}
.ib.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-d);font-weight:700}
.ib.danger{color:var(--bad);border-color:rgba(255,122,107,.5)}
.ib:disabled{opacity:.5}
.card input,.card select,.card textarea,.fi{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;margin:0 0 8px;min-height:44px}
textarea.fi{resize:vertical;min-height:70px}
.tab .bd{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn);color:#14161A;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.grp{margin-top:8px}
.grp button{min-height:40px}
.ct[data-act]{cursor:pointer}
.ct[data-act]:active{background:var(--card2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1>Movo <span style="color:var(--ac)">Admin</span></h1>
  <p id="lmsg">Acesso restrito. Entre com o seu e-mail de admin.</p>
  <form id="f1">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="seu e-mail" required>
    <button class="btn" id="b1" type="submit">Enviar código</button>
  </form>
  <form id="f2" hidden>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="código do e-mail" maxlength="10" required>
    <button class="btn" id="b2" type="submit">Entrar</button>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap">
      <button class="lk" id="voltar" type="button">Usar outro e-mail</button>
      <button class="lk" id="reenviar" type="button">Reenviar código</button>
    </div>
  </form>
  <div id="lerr" class="err" hidden style="margin-top:12px" role="alert"></div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="bar">
      <div class="logo">movo<b>.</b>admin</div>
      <div class="sp"></div>
      <button class="ib" id="reload" type="button">Atualizar</button>
    </div>
    <div class="cs grp" id="grp" role="group" aria-label="Área do painel"><button type="button" data-g="op">Operação</button><button type="button" data-g="met">Métricas</button></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Seções do painel"></div>
  </div>
  <main id="main" role="tabpanel" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <div class="foot"><span id="foot-info"></span><span class="sp"></span><button class="ib" id="sair" type="button">Sair da conta</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SB_URL = "https://wgdhjkebfvcmgokxscvb.supabase.co";
  var SB_KEY = "sb_publishable_W0cKrWrtCwCp1XjNl1JFqQ_myok_WPk";
  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  var $ = function (id) { return document.getElementById(id); };
  var TZ = "America/Sao_Paulo";

  // ---------- util ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) + "%" : "—"; }
  function pl(n, um, varios) { return n + " " + (n === 1 ? um : varios); }
  function dm(iso) { var p = String(iso).slice(0, 10).split("-"); return p[2] + "/" + p[1]; }
  function ago(ts) {
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 45) return "agora"; if (s < 3600) return "há " + Math.round(s / 60) + " min";
    return "há " + Math.round(s / 3600) + " h";
  }
  function dt(iso) { try { return new Date(iso).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function hojeBR() { return new Date().toLocaleDateString("sv-SE", { timeZone: TZ }); }
  function ultimosDias(n) {
    var p = hojeBR().split("-").map(Number), base = Date.UTC(p[0], p[1] - 1, p[2]), out = [];
    for (var i = n - 1; i >= 0; i--) out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
    return out;
  }
  function stat(n, l, cls, sub) { return '<div class="stat' + (cls ? " " + cls : "") + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + "</div>" + (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>"; }
  function barRow(titulo, n, max, extra, sub, tag) {
    return '<div class="row"><div class="t">' + esc(titulo) + (tag ? '<span class="pill warn">' + esc(tag) + "</span>" : "") + '</div><div class="v">' + esc(n) + (extra ? "<small>" + esc(extra) + "</small>" : "") + '</div><div class="b"><i style="width:' + (max > 0 ? Math.min(100, Math.max(2, Math.round((n / max) * 100))) : 0) + '%"></i></div>' + (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
  }
  function seg(id, vals, atual, suf) {
    return '<div class="seg" id="' + id + '">' + vals.map(function (n) { return '<button type="button" data-d="' + n + '" aria-pressed="' + (atual === n) + '">' + n + suf + "</button>"; }).join("") + "</div>";
  }

  // ---------- gráfico de barras com leitura ao toque ----------
  var charts = {};
  // layers: [{k, cls, label}]; modo "stack" empilha, "overlay" sobrepõe (a primeira camada é o fundo)
  function chart(id, serie, layers, modo) {
    charts[id] = { serie: serie, layers: layers };
    var max = 1;
    serie.forEach(function (x) {
      var v = modo === "stack" ? layers.reduce(function (s, l) { return s + (x[l.k] || 0); }, 0) : Math.max.apply(null, layers.map(function (l) { return x[l.k] || 0; }));
      if (v > max) max = v;
    });
    var bars = serie.map(function (x, i) {
      return '<div class="c" data-i="' + i + '">' + layers.map(function (l) { return '<i class="' + l.cls + '" style="height:' + ((x[l.k] || 0) / max) * 100 + '%"></i>'; }).join("") + "</div>";
    }).join("");
    var mid = serie[Math.floor(serie.length / 2)];
    var leg = layers.length > 1 ? '<div class="legend">' + layers.map(function (l) { return '<span class="' + l.cls + '">' + esc(l.label) + "</span>"; }).join("") + "</div>" : "";
    return '<div class="chartbox" data-chart="' + id + '" role="img" aria-label="Gráfico: ' + esc(layers.map(function (l) { return l.label; }).join(", ")) + ', toque nas barras para ler os valores"><div class="rd">toque numa barra para ver o valor · máx. ' + max + '</div><div class="chart ' + (modo === "stack" ? "stack" : "overlay") + '">' + bars + '</div><div class="axis"><span>' + dm(serie[0].dia) + "</span><span>" + dm(mid.dia) + "</span><span>" + dm(serie[serie.length - 1].dia) + "</span></div>" + leg + "</div>";
  }
  function ligarGraficos() {
    Array.prototype.forEach.call(document.querySelectorAll(".chartbox"), function (box) {
      var cfg = charts[box.getAttribute("data-chart")], rd = box.querySelector(".rd");
      function sel(e) {
        var c = e.target.closest(".c"); if (!c) return;
        Array.prototype.forEach.call(box.querySelectorAll(".c.sel"), function (n) { n.classList.remove("sel"); });
        c.classList.add("sel");
        var x = cfg.serie[+c.getAttribute("data-i")];
        rd.innerHTML = "<b>" + dm(x.dia) + "</b>: " + cfg.layers.map(function (l) { return esc(l.label) + " <b>" + (x[l.k] || 0) + "</b>"; }).join(" · ");
      }
      box.addEventListener("pointerdown", sel);
    });
  }

  // ---------- nomes legíveis dos eventos ----------
  var EV = {
    "Entrada": { login_codigo: "Login por código", login_link: "Login por link", aceite_registrado: "Aceitou os termos" },
    "Onboarding": { onboarding_iniciado: "Começou o onboarding", onb_atividades_escolhidas: "Escolheu atividades", onb_objetivo_forca: "Objetivo: força", onb_objetivo_emagrecer: "Objetivo: emagrecer", onb_objetivo_rotina: "Objetivo: criar rotina", onboarding_pulado: "Pulou o onboarding", onboarding_cancelado: "Cancelou o onboarding", onboarding_concluido: "Concluiu o onboarding" },
    "Treino": { treino_registrado: "Registrou treino (qualquer modalidade)", treino_concluido: "Concluiu treino", treino_concluido_com_ajuste: "Concluiu com ajuste de carga", treino_recorde: "Bateu recorde", primeiro_registro: "Primeiro registro", ficha_salva_com_ajustes: "Salvou ficha com ajustes", treino_herói_iniciar: "Iniciou treino pelo card principal", proximo_fazer_hoje: "Usou “próximo a fazer”" },
    "Corrida e provas": { corrida_registrada_manual: "Corrida registrada à mão", strava_importado: "Importou do Strava", treino_corrida_agendado: "Agendou corrida", treino_corrida_salvo: "Salvou corrida", meta_corrida_aberta: "Abriu meta de corrida", meta_corrida_definida: "Definiu meta de corrida", plano_corrida_aberto: "Abriu plano de corrida", plano_corrida_prompt: "Plano: viu o prompt", plano_corrida_ia_pedido: "Pediu plano com IA", plano_corrida_ia_gerado: "Plano com IA gerado", plano_corrida_ia_retomado: "Retomou plano com IA", plano_corrida_criado: "Criou plano de corrida", provas_aberta: "Abriu Provas", prova_marcada: "Marcou prova", prova_favoritada: "Favoritou prova", prova_manual_criada: "Criou prova manual", prova_km_definida: "Definiu distância da prova", prova_link_clicado: "Clicou no link da prova" },
    "Desafios e convites": { desafio_entrou: "Entrou em desafio", desafio_criado: "Criou desafio", desafio_aplauso: "Deu aplauso", desafio_treinei_com: "Marcou “treinei com”", desafio_cartao_compartilhado: "Compartilhou o cartão", convite_whatsapp: "Convidou por WhatsApp", convite_whatsapp_ranking: "Convidou pelo ranking" },
    "IA": { treino_ia_aberto_builder: "Abriu o montador com IA", treino_ia_iniciado: "Iniciou treino com IA", treino_ia_pronto: "Treino com IA pronto" },
    "Treinador": { coach_painel_aberto: "Abriu o painel do treinador", coach_semana_enviada: "Enviou semana ao aluno", coach_ficha_import_iniciado: "Começou a importar ficha" },
    "Disposição a pagar": { plano_interesse_treinador_pro: "Interesse no plano Treinador Pro" },
    "Conta e domínio": { dominio_novo_aberto: "Clicou no aviso do endereço novo", feedback_enviado: "Enviou feedback", dados_exportados: "Exportou os próprios dados" },
    "Telas abertas": { tela_hoje: "Tela: Hoje", tela_treinos: "Tela: Treinos", tela_evolucao: "Tela: Evolução", tela_desafios: "Tela: Desafios" },
    "Interface (diagnóstico)": { modo_sheet_aberto: "Abriu o seletor de modo", modo_trocado: "Trocou de modo", semana_card_aberto: "Abriu o card da semana", onb_visto_t1: "Onboarding: viu passo 1", onb_visto_t2: "Onboarding: viu passo 2", onb_visto_t3: "Onboarding: viu passo 3", onb_pulado_t3: "Onboarding: pulou passo 3", estado_vazio_cta_hoje_adicionar: "Tela vazia: adicionar treino", estado_vazio_cta_hoje_montar: "Tela vazia: montar treino", estado_vazio_cta_evolucao: "Tela vazia: evolução", logout: "Saiu da conta" }
  };
  var EVLOOK = {}; Object.keys(EV).forEach(function (g) { Object.keys(EV[g]).forEach(function (k) { EVLOOK[k] = { g: g, t: EV[g][k] }; }); });
  var OCULTOS = { "Telas abertas": 1, "Interface (diagnóstico)": 1 };

  // ---------- aba Contas: lista com rolagem, ordem por cadastro/último acesso e busca ----------
  function nrm(t) { return String(t == null ? "" : t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  function dd(iso) { try { return new Date(iso).toLocaleDateString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", year: "2-digit" }); } catch (e) { return "—"; } }
  function relIso(iso) {
    if (!iso) return "nunca";
    var min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (min < 2) return "agora"; if (min < 60) return "há " + min + " min";
    var h = Math.round(min / 60); if (h < 24) return "há " + h + " h";
    var dias = Math.round(h / 24); return dias < 60 ? "há " + dias + " dia" + (dias === 1 ? "" : "s") : "há " + Math.round(dias / 30) + " meses";
  }
  function contasOrdenar(lista, ord, dir, q) {
    var qq = nrm(q), sinal = dir === "asc" ? 1 : -1;
    var chave = function (u) { var v = ord === "acesso" ? (u.ultimo_acesso || u.ultimo_login) : u.cadastro; return v ? new Date(v).getTime() : null; };
    return lista.filter(function (u) { return !qq || nrm((u.nome || "") + " " + (u.email || "")).indexOf(qq) >= 0; }).sort(function (a, b) {
      var ka = chave(a), kb = chave(b);
      if (ka === null && kb === null) return 0; if (ka === null) return 1; if (kb === null) return -1; // sem data vai pro fim
      return (ka - kb) * sinal;
    });
  }
  function ligarContas(d) {

      var l = contasOrdenar(d, params.cOrd, params.cDir, params.cQ);

      $("c-dir").textContent = params.cDir === "desc" ? "↓ recentes primeiro" : "↑ antigos primeiro";

        return '<div class="ct" role="listitem" data-act="ver-conta" data-id="' + esc(u.id) + '"><div class="t">' + esc(u.nome || u.email) + (u.teste ? '<span class="pill">você/teste</span>' : "") + (u.treinou ? '<span class="pill ok">treinou</span>' : "") +

      }).join("") : '<div class="note">' + (d.length ? "Ninguém com esse nome ou e-mail." : "Nenhuma conta ainda.") + "</div>";

      if (my !== reqSeq) return;                       // trocou de aba enquanto carregava
      if (r.error) { mostrarErro(id, r.error.message); return; }
      cache[id] = { ts: Date.now(), data: r.data };
      paint(id, r.data, Date.now());
    }).catch(function (e) { if (my === reqSeq) mostrarErro(id, "sem conexão"); });
  }

  // ---------- sessão ----------
  function msgErro(m) {
    m = String(m || "");
    if (/signups? not allowed|not allowed for otp/i.test(m)) return "Esse e-mail não tem acesso.";
    if (/rate limit|after \d+ seconds|too many/i.test(m)) return "Aguarde um minuto para pedir outro código.";
    if (/invalid|expired/i.test(m)) return "Código inválido ou expirado.";
    return "Não foi possível: " + m;
  }
  function passoCodigo(email) { $("f1").hidden = true; $("f2").hidden = false; $("lmsg").textContent = "Enviamos um código para " + email + "."; $("otp").focus(); }
  function mostrarLogin() {
    $("app").hidden = true; $("login").hidden = false;
    $("lerr").hidden = true; $("otp").value = "";
    $("email").value = lsGet("movo-admin-email") || "";
    $("f1").hidden = false; $("f2").hidden = true; $("lmsg").textContent = "Acesso restrito. Entre com o seu e-mail de admin.";
    try { var pend = JSON.parse(lsGet("movo-admin-pend") || "null"); if (pend && Date.now() - pend.ts < 15 * 60 * 1000) { $("email").value = pend.email; passoCodigo(pend.email); } } catch (e) {}
  }
  function desenharAbas() {
    Array.prototype.forEach.call($("grp").children, function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-g") === grupo)); });
    var sel = DETALHE[atual] || atual;
    $("tabs").innerHTML = TABS.filter(function (t) { return t.g === grupo; }).map(function (t) {
      var n = BADGE[t.id] ? +pend[BADGE[t.id]] || 0 : 0;
      return '<button class="tab" role="tab" type="button" data-id="' + t.id + '" aria-selected="' + (t.id === sel) + '">' + t.t + (n ? '<span class="bd">' + n + "</span>" : "") + "</button>";
    }).join("");
    var opBtn = $("grp").children[0]; opBtn.textContent = "Operação" + (pend.total ? " (" + pend.total + ")" : "");
  }
  function mostrarApp() {
    $("login").hidden = true; $("app").hidden = false; lsSet("movo-admin-pend", null);
    if (!mostrarApp.ligado) {
      mostrarApp.ligado = true;
      $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) open(b.getAttribute("data-id")); });
      $("grp").addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b || b.getAttribute("data-g") === grupo) return;
        grupo = b.getAttribute("data-g"); desenharAbas();
        open(TABS.filter(function (t) { return t.g === grupo; })[0].id);
      });
    }
    carregarPendencias();
    $("foot-info").textContent = "Dados de São Paulo (UTC−3) · sem você e contas de teste";
    var h = (location.hash || "").slice(1), ini = lsGet("movo-admin-tab");
    var id = TABS.some(function (t) { return t.id === h; }) ? h : TABS.some(function (t) { return t.id === ini; }) ? ini : "pend";
    grupo = abaDe(id).g; desenharAbas();
    open(id);
  }
  sb.auth.onAuthStateChange(function (ev) { if (ev === "SIGNED_OUT") { cache = {}; mostrarLogin(); } });
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) mostrarApp(); else mostrarLogin(); }, function () { mostrarLogin(); });

  var cooldown = 0, cdTimer = null;
  function iniciarCooldown() {
    cooldown = 30; $("reenviar").disabled = true;
    clearInterval(cdTimer);
    cdTimer = setInterval(function () { cooldown--; if (cooldown <= 0) { clearInterval(cdTimer); $("reenviar").disabled = false; $("reenviar").textContent = "Reenviar código"; } else $("reenviar").textContent = "Reenviar em " + cooldown + "s"; }, 1000);
  }
  function enviarCodigo(email, depois) {
    $("lerr").hidden = true; $("b1").disabled = true;
    sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + "/admin/" } }).then(function (r) {
      $("b1").disabled = false;
      if (r.error) { $("lerr").hidden = false; $("lerr").textContent = msgErro(r.error.message); return; }
      lsSet("movo-admin-pend", JSON.stringify({ email: email, ts: Date.now() })); iniciarCooldown(); depois && depois();
    }, function () { $("b1").disabled = false; $("lerr").hidden = false; $("lerr").textContent = "Sem conexão. Tente de novo."; });
  }
  $("f1").addEventListener("submit", function (e) {
    e.preventDefault(); var em = $("email").value.trim().toLowerCase(); if (!em) return;
    lsSet("movo-admin-email", em); enviarCodigo(em, function () { passoCodigo(em); });
  });
  $("reenviar").addEventListener("click", function () { enviarCodigo($("email").value.trim().toLowerCase()); });
  $("otp").addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });
  $("f2").addEventListener("submit", function (e) {
    e.preventDefault(); $("b2").disabled = true; $("lerr").hidden = true;
    sb.auth.verifyOtp({ email: $("email").value.trim().toLowerCase(), token: $("otp").value.trim(), type: "email" }).then(function (r) {
      $("b2").disabled = false;
      if (r.error) { $("lerr").hidden = false; $("lerr").textContent = msgErro(r.error.message); return; }
      $("otp").value = ""; mostrarApp();
    }, function () { $("b2").disabled = false; $("lerr").hidden = false; $("lerr").textContent = "Sem conexão. Tente de novo."; });
  });
  $("voltar").addEventListener("click", function () { lsSet("movo-admin-pend", null); mostrarLogin(); });
  $("sair").addEventListener("click", function () { lsSet("movo-admin-pend", null); sb.auth.signOut(); });
  $("reload").addEventListener("click", function () { if (atual) { delete cache[atual]; open(atual, true); } });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !atual || $("app").hidden) return;
    var c = cache[atual]; if (c && Date.now() - c.ts > 5 * 60 * 1000) { delete cache[atual]; open(atual, true); }
  });
  setInterval(function () { var u = $("upd"); if (u && u.getAttribute("data-ts")) u.textContent = "Atualizado " + ago(+u.getAttribute("data-ts")); }, 30000);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "/admin/" }).catch(function () {});
})();
</script>
</body>
</html>
