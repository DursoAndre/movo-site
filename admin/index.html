<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>Movo Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14161A;--card:#1d2026;--card2:#252931;--line:#2e333c;--fg:#eef0f3;--mut:#9aa1ad;--ac:#bef230;--ac-d:#14161A;--bad:#ff7a6b;--warn:#ffc857;--new:#5cc8ff;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;margin:0 -2px}
.bar{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo b{color:var(--ac)}
.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--mut)}
.ib:active{background:var(--card2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--mut)}
.tab[aria-selected=true]{background:var(--ac);border-color:var(--ac);color:var(--ac-d);font-weight:700}
main{max-width:760px;margin:0 auto;padding-top:6px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px;font-weight:700}
.meta{color:var(--mut);font-size:12px;margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--mut);font-size:12.5px;margin-top:2px}
.stat.hi .n{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-width:0}
.note{color:var(--mut);font-size:12.5px;margin:8px 2px}
.note b{color:var(--fg)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.chart .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.chart .c i{display:block;background:var(--ac);border-radius:3px 3px 0 0;min-height:1px}
.chart .c i.o{background:var(--new);border-radius:0}
.chart .c i.a{background:var(--warn);border-radius:3px 3px 0 0}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--ac);margin-right:5px;vertical-align:-1px}
.legend .o::before{background:var(--new)}.legend .a::before{background:var(--warn)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.row .v small{color:var(--mut);font-weight:500;margin-left:5px}
.row .b{grid-column:1/-1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--ac);border-radius:3px}
.row .s{grid-column:1/-1;color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
td small{color:var(--mut)}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--card2);color:var(--mut)}
.pill.ok{background:rgba(190,242,48,.15);color:var(--ac)}
.pill.warn{background:rgba(255,200,87,.15);color:var(--warn)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:13px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--fg);font-weight:700}
.sk{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.err{background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.4);color:var(--bad);border-radius:12px;padding:12px 14px}
/* login */
.login{max-width:380px;margin:0 auto;padding-top:calc(14vh + env(safe-area-inset-top,0px))}
.login h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px}
.login p{color:var(--mut);margin:0 0 18px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;margin-bottom:10px}
input:focus{outline:2px solid var(--ac);outline-offset:0}
.btn{width:100%;background:var(--ac);color:var(--ac-d);border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px}
.btn:disabled{opacity:.6}
.lk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:10px 0;font-size:13px}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1>Movo <span style="color:var(--ac)">Admin</span></h1>
  <p>Acesso restrito. Entre com o seu e-mail de admin.</p>
  <form id="f1">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="seu e-mail" required>
    <button class="btn" id="b1" type="submit">Enviar código</button>
  </form>
  <form id="f2" hidden>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="código do e-mail" required>
    <button class="btn" id="b2" type="submit">Entrar</button>
    <button class="lk" id="voltar" type="button">Usar outro e-mail</button>
  </form>
  <div id="lerr" class="err" hidden style="margin-top:12px"></div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="bar">
      <div class="logo">movo<b>.</b>admin</div>
      <div class="sp"></div>
      <button class="ib" id="reload" type="button" aria-label="Atualizar">Atualizar</button>
      <button class="ib" id="sair" type="button">Sair</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SB_URL = "https://wgdhjkebfvcmgokxscvb.supabase.co";
  var SB_KEY = "sb_publishable_W0cKrWrtCwCp1XjNl1JFqQ_myok_WPk";
  var sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  var $ = function (id) { return document.getElementById(id); };
  var TZ = "America/Sao_Paulo";

  // ---------- util ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) + "%" : "—"; }
  function dm(iso) { var p = String(iso).slice(0, 10).split("-"); return p[2] + "/" + p[1]; }
  function ago(ts) {
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 45) return "agora"; if (s < 3600) return Math.round(s / 60) + " min atrás";
    return Math.round(s / 3600) + " h atrás";
  }
  function dt(iso) { try { return new Date(iso).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function stat(n, l, hi) { return '<div class="stat' + (hi ? " hi" : "") + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + "</div></div>"; }
  function barRow(titulo, n, max, extra, sub) {
    return '<div class="row"><div class="t">' + esc(titulo) + '</div><div class="v">' + esc(n) + (extra ? "<small>" + esc(extra) + "</small>" : "") + '</div><div class="b"><i style="width:' + (max > 0 ? Math.max(2, Math.round((n / max) * 100)) : 0) + '%"></i></div>' + (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
  }

  // nomes legíveis dos eventos, agrupados por área
  var EV = {
    "Entrada": { login_codigo: "Login por código", login_link: "Login por link", logout: "Saiu da conta", aceite_registrado: "Aceitou os termos" },
    "Onboarding": { onboarding_iniciado: "Começou o onboarding", onb_visto_t1: "Viu o passo 1", onb_visto_t2: "Viu o passo 2", onb_visto_t3: "Viu o passo 3", onb_atividades_escolhidas: "Escolheu atividades", onb_objetivo_forca: "Objetivo: força", onb_objetivo_emagrecer: "Objetivo: emagrecer", onb_objetivo_rotina: "Objetivo: criar rotina", onb_pulado_t3: "Pulou o passo 3", onboarding_pulado: "Pulou o onboarding", onboarding_concluido: "Concluiu o onboarding", estado_vazio_cta_hoje_adicionar: "Tela vazia: adicionar treino", estado_vazio_cta_evolucao: "Tela vazia: evolução" },
    "Treino": { treino_concluido: "Concluiu treino", treino_concluido_com_ajuste: "Concluiu com ajuste de carga", treino_recorde: "Bateu recorde", primeiro_registro: "Primeiro registro", ficha_salva_com_ajustes: "Salvou ficha com ajustes", treino_herói_iniciar: "Iniciou treino pelo card principal", modo_sheet_aberto: "Abriu o seletor de modo", modo_trocado: "Trocou de modo", proximo_fazer_hoje: "Próximo a fazer (hoje)", semana_card_aberto: "Abriu o card da semana" },
    "Corrida e provas": { corrida_registrada_manual: "Corrida registrada à mão", treino_corrida_agendado: "Agendou corrida", treino_corrida_salvo: "Salvou corrida", meta_corrida_aberta: "Abriu meta de corrida", meta_corrida_definida: "Definiu meta de corrida", plano_corrida_aberto: "Abriu plano de corrida", plano_corrida_prompt: "Plano: viu o prompt", plano_corrida_ia_pedido: "Pediu plano com IA", plano_corrida_ia_gerado: "Plano com IA gerado", plano_corrida_criado: "Criou plano de corrida", provas_aberta: "Abriu Provas", prova_marcada: "Marcou prova", prova_km_definida: "Definiu distância da prova", prova_link_clicado: "Clicou no link da prova" },
    "Desafios e convites": { desafio_entrou: "Entrou em desafio", desafio_criado: "Criou desafio", desafio_aplauso: "Deu aplauso", desafio_cartao_compartilhado: "Compartilhou o cartão", convite_whatsapp: "Convidou por WhatsApp" },
    "IA": { treino_ia_aberto_builder: "Abriu o montador com IA", treino_ia_iniciado: "Iniciou treino com IA", treino_ia_pronto: "Treino com IA pronto" },
    "Treinador": { coach_painel_aberto: "Abriu o painel do treinador", plano_interesse_treinador_pro: "Interesse no plano Treinador Pro" },
    "Domínio": { dominio_novo_aberto: "Clicou no aviso do endereço novo" }
  };
  var EVLOOK = {}; Object.keys(EV).forEach(function (g) { Object.keys(EV[g]).forEach(function (k) { EVLOOK[k] = { g: g, t: EV[g][k] }; }); });
  var TELAS = { hoje: "Hoje", treinos: "Treinos", evolucao: "Evolução", desafios: "Desafios" };
  function evInfo(name) {
    if (EVLOOK[name]) return EVLOOK[name];
    if (name.indexOf("tela_") === 0) { var k = name.slice(5); return { g: "Telas abertas", t: "Tela: " + (TELAS[k] || k) }; }
    return { g: "Outros", t: name };
  }
  var GORDEM = ["Telas abertas", "Entrada", "Onboarding", "Treino", "Corrida e provas", "Desafios e convites", "IA", "Treinador", "Domínio", "Outros"];

  // ---------- abas (cada uma só carrega quando aberta) ----------
  var TABS = [
    { id: "geral", t: "Visão geral" },
    { id: "ret", t: "Retenção" },
    { id: "funil", t: "Funil" },
    { id: "uso", t: "Uso" },
    { id: "conv", t: "Convites" },
    { id: "dom", t: "Domínio" }
  ];
  var cache = {};       // id -> { ts, data }
  var params = { uso: 30, conv: 30, dom: 14 };
  var atual = null, reqSeq = 0;

  function call(tab) {
    if (tab === "geral") return sb.rpc("admin_m_geral");
    if (tab === "ret") return sb.rpc("admin_m_retencao");
    if (tab === "funil") return sb.rpc("admin_m_funil");
    if (tab === "uso") return sb.rpc("admin_m_funcoes", { p_dias: params.uso });
    if (tab === "conv") return sb.rpc("admin_m_convites", { p_dias: params.conv });
    return sb.rpc("admin_m_dominio", { p_dias: params.dom });
  }

  function chartBars(serie, campo) {
    var max = Math.max.apply(null, serie.map(function (x) { return x[campo]; }).concat([1]));
    return '<div class="chart">' + serie.map(function (x) { return '<div class="c" title="' + dm(x.dia) + ": " + x[campo] + '"><i style="height:' + (x[campo] / max) * 100 + '%"></i></div>'; }).join("") + "</div>" +
      '<div class="axis"><span>' + dm(serie[0].dia) + "</span><span>" + dm(serie[serie.length - 1].dia) + "</span></div>";
  }

  var VIEW = {
    geral: function (d) {
      var h = '<h2>Pessoas ativas</h2><div class="grid g3">' + stat(d.dau, "hoje", true) + stat(d.wau, "últimos 7 dias") + stat(d.mau, "últimos 30 dias") + "</div>";
      h += '<div class="note">Engajamento (hoje ÷ 30 dias): <b>' + pct(d.dau, d.mau) + "</b> · semana ÷ 30 dias: <b>" + pct(d.wau, d.mau) + "</b></div>";
      h += '<h2>Base</h2><div class="grid g3">' + stat(d.contas, "contas criadas") + stat(d.novas_7d, "novas em 7 dias") + stat(d.novas_hoje, "novas hoje") + stat(d.abriram_algum_dia, "já abriram o app") + stat(d.com_treino, "registraram treino") + stat(d.instalado_7d, "abriram instalado (7d)") + "</div>";
      h += '<div class="note">“Instalado” só conta aberturas a partir da v176.</div>';
      h += '<h2>Pessoas por dia (30 dias)</h2><div class="card">' + chartBars(d.serie, "pessoas") + "</div>";
      h += '<h2>Contas novas por dia</h2><div class="card">' + chartBars(d.serie, "novas") + "</div>";
      return h;
    },
    ret: function (d) {
      function cel(a, b) { return b > 0 ? pct(a, b) + " <small>" + a + "/" + b + "</small>" : "<small>—</small>"; }
      var t = d.total;
      var h = '<h2>Quem voltou</h2><div class="grid g3">' + stat(pct(t.d1, t.el1), "voltou no dia seguinte (D1)", true) + stat(pct(t.d7, t.el7), "voltou na 2ª semana (D7)") + stat(pct(t.d30, t.el30), "voltou após 30 dias (D30)") + "</div>";
      h += '<div class="note"><b>D1</b>: abriu o app no dia seguinte ao cadastro. <b>D7</b>: abriu entre o dia 7 e o 13. <b>D30</b>: abriu do dia 30 em diante. Só entra na conta quem já tem tempo de cadastro suficiente.</div>';
      h += '<h2>Por semana de cadastro</h2><div class="card scroll"><table><tr><th>Semana</th><th>Cadastros</th><th>D1</th><th>D7</th><th>D30</th></tr>';
      d.semanas.forEach(function (s) { h += "<tr><td>" + dm(s.semana) + "</td><td>" + s.cadastros + "</td><td>" + cel(s.d1, s.el1) + "</td><td>" + cel(s.d7, s.el7) + "</td><td>" + cel(s.d30, s.el30) + "</td></tr>"; });
      return h + "</table></div>";
    },
    funil: function (d) {
      var topo = d[0].n, h = '<h2>Do cadastro ao hábito</h2><div class="card">';
      d.forEach(function (e, i) {
        var prev = i ? d[i - 1].n : null;
        h += barRow(e.etapa, e.n, topo, pct(e.n, topo), prev != null && i > 1 ? "da etapa anterior: " + pct(e.n, prev) : "");
      });
      h += '</div><div class="note">Os eventos de onboarding e treino só existem desde 05/10/2026; contas anteriores aparecem nas duas primeiras etapas, mas podem faltar nas demais. “Voltaram 7+ dias” vem das aberturas do app, então vale para todos.</div>';
      return h;
    },
    uso: function (d) {
      var base = d.ativos_periodo, grupos = {};
      d.itens.forEach(function (it) { var i = evInfo(it.name); (grupos[i.g] = grupos[i.g] || []).push({ t: i.t, it: it }); });
      var h = '<div class="meta"><div class="seg" id="seg-uso">' + [7, 30, 90].map(function (n) { return '<button type="button" data-d="' + n + '" aria-pressed="' + (params.uso === n) + '">' + n + " dias</button>"; }).join("") + "</div></div>";
      h += '<div class="note">Base: <b>' + base + "</b> pessoas ativas no período (<b>" + d.ativos_7d + "</b> nos últimos 7 dias). A barra é a % das pessoas ativas que usaram. Sinal, não estatística: a base ainda é pequena.</div>";
      GORDEM.forEach(function (g) {
        if (!grupos[g]) return;
        h += "<h2>" + esc(g) + '</h2><div class="card">';
        grupos[g].forEach(function (x) { h += barRow(x.t, x.it.pessoas, Math.max(base, 1), pct(x.it.pessoas, base), x.it.vezes + " vezes · " + x.it.pessoas_7d + " na última semana · último uso " + dm(x.it.ultima)); });
        h += "</div>";
      });
      return h;
    },
    conv: function (d) {
      var nome = { convite_whatsapp: "Convites enviados por WhatsApp", desafio_criado: "Desafios criados", desafio_cartao_compartilhado: "Cartões de desafio compartilhados", desafio_entrou: "Entradas em desafio", desafio_aplauso: "Aplausos" };
      var h = '<div class="meta"><div class="seg" id="seg-conv">' + [7, 30, 90].map(function (n) { return '<button type="button" data-d="' + n + '" aria-pressed="' + (params.conv === n) + '">' + n + " dias</button>"; }).join("") + "</div></div>";
      h += '<h2>No app</h2><div class="card">' + (d.eventos.length ? d.eventos.map(function (e) { return '<div class="row"><div class="t">' + esc(nome[e.name] || e.name) + '</div><div class="v">' + e.pessoas + "<small>pessoas · " + e.vezes + "×</small></div></div>"; }).join("") : '<div class="note">Nada no período.</div>') + "</div>";
      h += '<div class="note">O funil de convite completo (enviado → link aberto → entrou) ainda não existe: hoje só medimos o envio e a entrada.</div>';
      var ln = { view: "Visitas à landing", chapter: "Capítulos do vídeo vistos", cta_open_app: "Cliques em “abrir o app”", video_play: "Vídeo iniciado", click_email: "Cliques no e-mail", install_guide: "Guia de instalação" };
      h += '<h2>Landing (movoapp.com.br)</h2><div class="card">' + (d.landing.length ? d.landing.map(function (e) { return '<div class="row"><div class="t">' + esc(ln[e.name] || e.name) + '</div><div class="v">' + e.n + "</div></div>"; }).join("") : '<div class="note">Nada no período.</div>') + "</div>";
      if (d.origens.length) h += '<h2>Origem das visitas</h2><div class="card">' + d.origens.map(function (e) { return '<div class="row"><div class="t">' + esc(e.src) + '</div><div class="v">' + e.n + "</div></div>"; }).join("") + "</div>";
      return h;
    },
    dom: function (d) {
      var dias = {}; d.serie.forEach(function (x) { (dias[x.dia] = dias[x.dia] || { antigo: 0, novo: 0 })[x.site] = x.pessoas; });
      var ks = Object.keys(dias).sort();
      var max = Math.max.apply(null, ks.map(function (k) { return dias[k].antigo + dias[k].novo; }).concat([1]));
      var h = '<div class="meta"><div class="seg" id="seg-dom">' + [7, 14, 30].map(function (n) { return '<button type="button" data-d="' + n + '" aria-pressed="' + (params.dom === n) + '">' + n + " dias</button>"; }).join("") + "</div></div>";
      h += '<h2>Hoje</h2><div class="grid">' + stat(d.hoje_antigo, "no endereço antigo (github.io)", d.hoje_antigo > 0) + stat(d.hoje_novo, "no endereço novo", true) + "</div>";
      h += '<div class="note">Aviso do endereço novo clicado: <b>' + d.banner.pessoas + "</b> pessoa(s). Origem exata (pelo endereço) vale desde <b>" + (d.host_desde ? dt(d.host_desde) : "— (v176 ainda não publicada)") + "</b>; antes disso é estimada pela versão (≤ v174 = antigo).</div>";
      h += '<h2>Pessoas por dia</h2><div class="card"><div class="chart">' + ks.map(function (k) { var a = dias[k].antigo, n = dias[k].novo; return '<div class="c" title="' + dm(k) + " · antigo " + a + " · novo " + n + '"><i class="o" style="height:' + (n / max) * 100 + '%"></i><i class="a" style="height:' + (a / max) * 100 + '%"></i></div>'; }).join("") + '</div><div class="axis"><span>' + (ks[0] ? dm(ks[0]) : "") + "</span><span>" + (ks.length ? dm(ks[ks.length - 1]) : "") + '</span></div><div class="legend"><span class="a">antigo</span><span class="o">novo</span></div></div>';
      h += "<h2>Versão da última abertura (7 dias)</h2><div class=\"card\">" + d.versoes.map(function (v) { return '<div class="row"><div class="t">' + esc(v.versao) + '</div><div class="v">' + v.pessoas + "</div></div>"; }).join("") + '</div><div class="note">Quem está em “antes da v164” ainda não tem nem o aviso do endereço novo.</div>';
      h += "<h2>Ainda no endereço antigo (7 dias)</h2>";
      if (!d.ainda_antigo.length) h += '<div class="card"><div class="note">Ninguém. 🎉</div></div>';
      else {
        h += '<div class="card">' + d.ainda_antigo.map(function (p) { return '<div class="row"><div class="t">' + esc(p.email || "(sem e-mail)") + '</div><div class="v"><small>' + esc(p.versao || "<v164") + "</small></div><div class=\"s\">última abertura " + dt(p.ultima) + " · " + p.dias + " dia(s) na semana</div></div>"; }).join("") + "</div>";
        h += '<button class="ib" id="cp-emails" type="button">Copiar e-mails</button>';
      }
      return h;
    }
  };

  function paint(id, d, ts) {
    var h = '<div class="meta"><span>Atualizado ' + ago(ts) + "</span></div>" + VIEW[id](d);
    $("main").innerHTML = h;
    var seg = document.querySelector(".seg");
    if (seg) seg.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      params[id] = +b.getAttribute("data-d"); delete cache[id]; open(id, true);
    });
    var cp = $("cp-emails");
    if (cp) cp.addEventListener("click", function () {
      var t = d.ainda_antigo.map(function (p) { return p.email; }).filter(Boolean).join(", ");
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { cp.textContent = "Copiado ✓"; }, function () { cp.textContent = t; });
    });
  }

  function open(id, force) {
    atual = id; lsSet("movo-admin-tab", id);
    Array.prototype.forEach.call($("tabs").children, function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-id") === id)); });
    var c = cache[id];
    if (c && !force) { paint(id, c.data, c.ts); return; }
    var my = ++reqSeq;
    $("main").innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    call(id).then(function (r) {
      if (my !== reqSeq) return;                       // trocou de aba enquanto carregava
      if (r.error) {
        var forb = /forbidden/i.test(r.error.message || "");
        $("main").innerHTML = '<div class="err">' + (forb ? "Esta conta não tem acesso ao painel." : "Não consegui carregar: " + esc(r.error.message || "erro")) + '</div><p><button class="ib" id="tentar" type="button">Tentar de novo</button></p>';
        var t = $("tentar"); if (t) t.onclick = function () { open(id, true); };
        return;
      }
      cache[id] = { ts: Date.now(), data: r.data };
      paint(id, r.data, Date.now());
    });
  }

  // ---------- sessão ----------
  function mostrarLogin(msg) {
    $("app").hidden = true; $("login").hidden = false;
    $("email").value = lsGet("movo-admin-email") || "";
    if (msg) { $("lerr").hidden = false; $("lerr").textContent = msg; }
  }
  function mostrarApp() {
    $("login").hidden = true; $("app").hidden = false;
    if (!$("tabs").children.length) {
      $("tabs").innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" type="button" data-id="' + t.id + '" aria-selected="false">' + t.t + "</button>"; }).join("");
      $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) open(b.getAttribute("data-id")); });
    }
    var h = (location.hash || "").slice(1), ini = lsGet("movo-admin-tab");
    var id = TABS.some(function (t) { return t.id === h; }) ? h : TABS.some(function (t) { return t.id === ini; }) ? ini : "geral";
    open(id);
  }
  sb.auth.onAuthStateChange(function (ev, s) {
    if (ev === "SIGNED_OUT") { cache = {}; mostrarLogin(); }
  });
  sb.auth.getSession().then(function (r) { if (r.data && r.data.session) mostrarApp(); else mostrarLogin(); });

  $("f1").addEventListener("submit", function (e) {
    e.preventDefault(); var em = $("email").value.trim().toLowerCase(); if (!em) return;
    lsSet("movo-admin-email", em); $("b1").disabled = true; $("lerr").hidden = true;
    sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: false, emailRedirectTo: location.origin + "/admin/" } }).then(function (r) {
      $("b1").disabled = false;
      if (r.error) { $("lerr").hidden = false; $("lerr").textContent = "Não foi possível enviar: " + r.error.message; return; }
      $("f1").hidden = true; $("f2").hidden = false; $("otp").focus();
    });
  });
  $("f2").addEventListener("submit", function (e) {
    e.preventDefault(); $("b2").disabled = true; $("lerr").hidden = true;
    sb.auth.verifyOtp({ email: $("email").value.trim().toLowerCase(), token: $("otp").value.trim(), type: "email" }).then(function (r) {
      $("b2").disabled = false;
      if (r.error) { $("lerr").hidden = false; $("lerr").textContent = "Código inválido ou expirado."; return; }
      $("otp").value = ""; mostrarApp();
    });
  });
  $("voltar").addEventListener("click", function () { $("f2").hidden = true; $("f1").hidden = false; });
  $("sair").addEventListener("click", function () { sb.auth.signOut(); });
  $("reload").addEventListener("click", function () { if (atual) { delete cache[atual]; open(atual, true); } });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !atual || $("app").hidden) return;
    var c = cache[atual]; if (c && Date.now() - c.ts > 5 * 60 * 1000) { delete cache[atual]; open(atual, true); }
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "/admin/" }).catch(function () {});
})();
</script>
</body>
</html>
